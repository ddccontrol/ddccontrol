name: Release Please

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release to recover; leave empty to prepare or publish the release PR
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      inputs.tag == '' &&
      ((github.event_name != 'pull_request' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        startsWith(github.head_ref, 'release-please--') &&
        contains(github.event.pull_request.labels.*.name, 'autorelease: pending')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
      actions: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      check_id: ${{ steps.plan.outputs.check_id }}
      run_id: ${{ steps.plan.outputs.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare the release PR without publishing
        if: github.event_name != 'pull_request'
        uses: googleapis/release-please-action@v5
        with:
          skip-github-release: true
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
      - name: Plan package validation or require an approved build
        id: plan
        uses: actions/github-script@v8
        with:
          script: |
            const {plan} = require('./scripts/release/release-package-gate.cjs');
            const outputs = await plan({github, context});
            for (const [key, value] of Object.entries(outputs)) core.setOutput(key, value);

  packages:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/validate-release-packages.yml
    with:
      source-ref: ${{ needs.plan.outputs.commit }}
      version: ${{ needs.plan.outputs.version }}
    secrets:
      FEDORA_DDCCONTROL_READ_TOKEN: ${{ secrets.FEDORA_DDCCONTROL_READ_TOKEN }}

  repositories:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/package-repositories.yml
    with:
      source-ref: ${{ needs.plan.outputs.commit }}

  full-database-check:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: Check out monitor database
        uses: actions/checkout@v6
        with:
          repository: ddccontrol/ddccontrol-db
          path: ddccontrol-db-checkout

      - name: Generate monitor database options
        run: make -C ddccontrol-db-checkout db/options.xml

      - name: Test all monitor profiles
        env:
          DDCCONTROL_DB_TEST_DATADIR: ${{ github.workspace }}/ddccontrol-db-checkout/db
          DDCCONTROL_DB_TEST_ALL: "1"
          DDCCONTROL_DB_CONVERTER: ${{ runner.temp }}/dbgen-test/debug/ddccontrol-dbgen
          CARGO_TARGET_DIR: ${{ runner.temp }}/dbgen-test
        run: |
          cargo build --locked -p ddccontrol-dbgen
          cargo test --workspace --locked

  release-package-check:
    needs: [plan, packages, repositories, full-database-check]
    if: always() && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      checks: write
    steps:
      - name: Report the complete result on the release PR
        uses: actions/github-script@v8
        env:
          CHECK_ID: ${{ needs.plan.outputs.check_id }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          REPOSITORIES_RESULT: ${{ needs.repositories.result }}
          DATABASE_RESULT: ${{ needs.full-database-check.result }}
        with:
          script: |
            const results = [process.env.PACKAGES_RESULT, process.env.REPOSITORIES_RESULT, process.env.DATABASE_RESULT];
            const success = results.every(result => result === 'success');
            await github.rest.checks.update({
              ...context.repo, check_run_id: Number(process.env.CHECK_ID),
              status: 'completed', conclusion: success ? 'success' : 'failure',
              output: {
                title: success ? 'Release packages validated' : 'Release package validation failed',
                summary: `Packages: ${results[0]}; repositories: ${results[1]}; monitor database: ${results[2]}.`,
              },
            });
            if (!success) core.setFailed('Release packages must pass before publishing');

  release-please:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          skip-github-pull-request: true
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  release-artifacts:
    needs: [plan, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-packages.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      build-run-id: ${{ fromJSON(needs.plan.outputs.run_id || '0') }}
      build-commit: ${{ needs.plan.outputs.commit }}
    secrets: inherit
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write

  recover-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.tag != ''
    uses: ./.github/workflows/release-packages.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write

  notify-website:
    needs: [release-please, release-artifacts]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
    steps:
      - name: Trigger website rebuild
        if: ${{ env.WEBSITE_DISPATCH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.WEBSITE_DISPATCH_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api --method POST repos/ddccontrol/ddccontrol.github.io/dispatches \
            --field event_type=ddccontrol-release \
            --field "client_payload[tag]=$TAG_NAME"

      - name: Report missing website token
        if: ${{ env.WEBSITE_DISPATCH_TOKEN == '' }}
        run: echo "WEBSITE_DISPATCH_TOKEN is not configured; the scheduled website build will pick up this release."
