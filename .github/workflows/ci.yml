name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: read

jobs:
  rust:
    name: rust (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Minimum from workspace.package.rust-version, Debian 13, and stable.
        toolchain: ["1.77.0", "1.85.0", stable]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal

      - name: Install formatting and lint tools
        if: matrix.toolchain == 'stable'
        run: rustup component add --toolchain stable rustfmt clippy

      - name: Check Rust formatting
        if: matrix.toolchain == 'stable'
        run: cargo +stable fmt --all -- --check

      - name: Check Rust lints
        if: matrix.toolchain == 'stable'
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust without gettext
        run: cargo +${{ matrix.toolchain }} test --workspace --no-default-features --locked

      - name: Test Rust with all features
        run: cargo +${{ matrix.toolchain }} test --workspace --all-features --locked

      - name: Build release static library
        run: cargo +${{ matrix.toolchain }} build --release -p ddccontrol-db --all-features --locked

      - name: Check build cleanliness
        run: ./scripts/check_git_clean_after_build.sh

  build:
    name: build (${{ matrix.target.arch }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      matrix:
        target:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: armhf
            platform: linux/arm/v7
            runner: ubuntu-24.04-arm
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v6

      - name: Prepare CI image
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
          image=ghcr.io/ddccontrol/ddccontrol-ci:latest
          if docker pull --platform "${{ matrix.target.platform }}" "$image"; then
            echo "CI_IMAGE=$image" >> "$GITHUB_ENV"
          else
            image=ddccontrol-ci:${{ matrix.target.arch }}
            docker buildx create --use
            docker buildx inspect --bootstrap
            docker buildx build \
              --platform "${{ matrix.target.platform }}" \
              --load \
              --tag "$image" \
              .github/ci
            echo "CI_IMAGE=$image" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          docker run --rm \
            --platform "${{ matrix.target.platform }}" \
            -e CC="${{ matrix.compiler }}" \
            -v "${{ github.workspace }}:/src:ro" \
            "$CI_IMAGE" \
            bash -lc '
              set -e
              cp -a /src /tmp/ddccontrol
              cd /tmp/ddccontrol
              git config --global --add safe.directory /tmp/ddccontrol
              git clean -fdX
              ./.github/ci/install-rust.sh
              ./autogen.sh
              ./configure --enable-doc CFLAGS="$CFLAGS"
              make -j$(nproc)
              make check
              ./scripts/format_code.sh
              find -name "*.orig" -exec rm -v {} \;
              ./scripts/check_git_clean_after_build.sh
            '
