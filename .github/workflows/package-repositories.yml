name: Package repository checks

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ""
  pull_request:
    paths:
      - '.github/workflows/*packages*.yml'
      - '.github/workflows/release-please.yml'
      - '.github/workflows/package-repositories.yml'
      - '.github/workflows/build-dbgen.yml'
      - 'scripts/release/**'
      - '.github/build-images/**'
      - '.github/ci/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/*packages*.yml'
      - '.github/workflows/release-please.yml'
      - '.github/workflows/package-repositories.yml'
      - '.github/workflows/build-dbgen.yml'
      - 'scripts/release/**'
      - '.github/build-images/**'
      - '.github/ci/**'

permissions:
  contents: read

jobs:
  repositories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Check scripts and bundle extraction
        run: |
          ./scripts/release/run-build-image.sh repositories linux/amd64 shellcheck scripts/release/*.sh
          node --test scripts/release/test-*.cjs
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release/test-bundles.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release/test-build-images.py
      - name: Test signed repositories with APT and DNF
        run: |
          image=$(./scripts/release/build-image.sh ensure repositories linux/amd64)
          echo "Build host: $(uname -m); container target: linux/amd64"
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src \
            "$image" bash scripts/release/test-repositories.sh
