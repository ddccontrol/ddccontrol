name: Build standalone database producer

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ""
      version:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  dbgen:
    name: dbgen (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      DBGEN_RUST_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Install native static build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools binutils astyle jq
          rustup toolchain install "$DBGEN_RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
      - name: Build and exercise standalone producer
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version=${RELEASE_VERSION:-$(sed -n 's/^AC_INIT(\[DDC\/CI control tool\],\[\([^]]*\)\].*/\1/p' configure.ac)}
          ./scripts/release/build-dbgen.sh "${{ matrix.target }}" "$version" "$RUNNER_TEMP/dbgen"
          ./scripts/format_code.sh
          find . -name '*.orig' -delete
          ./scripts/check_git_clean_after_build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dbgen-${{ matrix.target }}
          path: ${{ runner.temp }}/dbgen/artifacts/
          if-no-files-found: error
