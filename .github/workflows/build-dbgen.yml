name: Build standalone database producer

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ""
      version:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  dbgen:
    name: dbgen (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      DBGEN_RUST_TOOLCHAIN: "1.85.0"
    steps:
      - name: Check out build automation
        uses: actions/checkout@v6
        with:
          path: automation
          persist-credentials: false
      - name: Check out producer source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          path: source
          persist-credentials: false
      - name: Build and exercise standalone producer
        working-directory: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ../automation/scripts/release/run-build-image.sh dbgen "${{ matrix.platform }}" bash -se <<'BUILD'
          version=${RELEASE_VERSION:-$(sed -n 's/^AC_INIT(\[DDC\/CI control tool\],\[\([^]]*\)\].*/\1/p' configure.ac)}
          ./scripts/release/build-dbgen.sh "${{ matrix.target }}" "$version" "$RUNNER_TEMP/dbgen"
          ./scripts/format_code.sh
          find . -name '*.orig' -delete
          ./scripts/check_git_clean_after_build.sh
          BUILD

      - uses: actions/upload-artifact@v7
        with:
          name: dbgen-${{ matrix.target }}
          path: ${{ runner.temp }}/dbgen/artifacts/
          if-no-files-found: error
