name: Build RPM packages

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      packaging-ref:
        type: string
        required: true
      automation-ref:
        type: string
        default: ""
      source-artifact:
        type: string
        default: release-sources
    secrets:
      FEDORA_DDCCONTROL_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - {arch: x86_64, platform: linux/amd64, runner: ubuntu-24.04}
          - {arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.automation-ref || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ddccontrol/fedora-ddccontrol
          ref: ${{ inputs.packaging-ref }}
          path: packaging
          token: ${{ secrets.FEDORA_DDCCONTROL_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.source-artifact }}
          path: ${{ runner.temp }}/sources
      - name: Build RPM packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_PLATFORM: ${{ matrix.target.platform }}
        run: |
          set -euo pipefail
          echo "Build host: $(uname -m); Fedora target: $TARGET_PLATFORM"
          mkdir -p "$RUNNER_TEMP/packages"
          docker run --rm --platform "$TARGET_PLATFORM" \
            -v "$GITHUB_WORKSPACE:/automation:ro" \
            -v "$RUNNER_TEMP/sources:/sources:ro" \
            -v "$RUNNER_TEMP/packages:/output" \
            fedora:44 \
            bash /automation/scripts/release/build-rpm.sh \
              "/sources/ddccontrol-$RELEASE_VERSION-vendor.tar.gz" \
              /automation/packaging "$RELEASE_VERSION" /output
      - uses: actions/upload-artifact@v7
        with:
          name: packages-fedora-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error

