[package]
name = "ddccontrol-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ddccontrol-protocol = { path = ".." }

# Fuzz tooling is optional and excluded from production/Debian dependencies.
[workspace]
members = ["."]

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false
